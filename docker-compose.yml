services:
  db:
    image: postgres:17-alpine
    container_name: my_message_db
    environment:
      POSTGRES_USER: my_message
      POSTGRES_PASSWORD: my_message
      POSTGRES_DB: my_message
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_message"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
